server:
  port: ${your.server.port}

spring:
  profiles:
    active: local                 #TODO------------------改------------------------------

gateway:
  white-list:
    - /center-common/user/register
    - /center-common/user/login
    - /center-common/user/getEmailCode
    - /center-common/user/forgetPassword
  routes:
    goroup: ${your.gateway.routes.goroup}
    data-id: ${your.gateway.routes.data-id}

# JWT 配置
jwt:
  secret-key: ${your.jwt.secret-key}

# 日志配置（对应logback-spring.xml里的LOG_PATH）
logging:
  level:
    #✅ 你的业务代码包：设为DEBUG
    # 把 com.yourproject 改成你项目的**根包名**（启动类所在的包）
    com.yulgnier.gateway: DEBUG            #TODO-----------------------改---------------------
    com.yulgnier.common: DEBUG  # 公共模块（包含全局异常处理器）  #TODO-----------------------改---------------------

truth:
  truth-key: ${your.truth.truth-key}
  truth-value: ${your.truth.truth-value}